<script>
(()=> {
"use strict";
const DB="mihogar360_v1_data";
const cats=["Vivienda","Alimentación","Servicios","Transporte","Educación","Salud","Deudas y cuotas","Entretenimiento","Ahorro","Otros"];
const navs=[["home","⌂","Inicio"],["calendar","▦","Calendario"],["budget","↗","Presupuesto"],["reports","▤","Informes"],["goals","◎","Ahorro"],["family","♡","Familia"],["settings","⚙","Ajustes"]];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const blank=()=>({schemaVersion:1,settings:{currency:"USD"},members:[],transactions:[],payments:[],budgets:[],goals:[],contributions:[],tasks:[],events:[]});
let data=load(),page="home",month=new Date().getMonth(),year=new Date().getFullYear(),modalEdit=null,filterText="",noticeText="",noticeTimer=null;
const CLOUDCFG="mihogar360_cloud_config", CLOUDHOUSE="mihogar360_household_id";let cloudClient=null,cloudUser=null,cloudSession=null,cloudRole=null,cloudMemberProfileId=null,cloudCanAddExpenses=false,cloudHouseholdId=localStorage.getItem(CLOUDHOUSE)||"",cloudTimer=null,cloudBusy=false,cloudStatus="Sin configurar",cloudInviteCode="";
function load(){try{const raw=localStorage.getItem(DB);if(raw){const d=JSON.parse(raw);return {...blank(),...d}}}catch(e){}return blank()}
function save(){try{localStorage.setItem(DB,JSON.stringify(data));scheduleCloudSync();return true}catch(e){toast("No se pudo guardar. Exporta un respaldo y libera espacio.");return false}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(cents){return new Intl.NumberFormat("es-SV",{style:"currency",currency:"USD"}).format((Number(cents)||0)/100)}
function cents(v){const n=Number(v);return Number.isFinite(n)?Math.round(n*100):0}
function fmtDate(s){if(!s)return "Sin fecha";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-SV",{day:"numeric",month:"short",year:"numeric"})}

function renderGoals(){return `${heading("Metas de ahorro","Pequeños pasos hacia tus objetivos.",`<button class="btn teal" data-modal="goal">＋ Nueva meta</button>`)}<div class="cards">${stat("Metas activas",String(data.goals.length),"◎","Objetivos del hogar")}${stat("Objetivo total",money(sum(data.goals,g=>g.target)),"⌁","Monto combinado")}${stat("Ahorro neto",money(sum(data.contributions,c=>c.type==="withdraw"?-c.amount:c.amount)),"↗","Aportaciones menos retiros")}${stat("Metas completadas",String(data.goals.filter(g=>sum(data.contributions.filter(c=>c.goalId===g.id),c=>c.type==="withdraw"?-c.amount:c.amount)>=g.target).length),"✓","Según aportaciones registradas")}</div><div class="section panel">${data.goals.length?data.goals.map(g=>{let saved=sum(data.contributions.filter(c=>c.goalId===g.id),c=>c.type==="withdraw"?-c.amount:c.amount),pct=g.target?Math.min(100,Math.max(0,saved/g.target*100)):0,remaining=Math.max(0,g.target-saved);return `<div class="goal"><div class="goalrow"><div><strong>${esc(g.name)}</strong><div class="small muted">${g.due?`Objetivo: ${fmtDate(g.due)}`:"Sin fecha objetivo"}</div></div><div class="rowwrap"><button class="btn teal" data-contribute="${g.id}">＋ Aportar</button><button class="btn light" data-edit-goal="${g.id}">✎</button><button class="btn light" data-delete-goal="${g.id}">×</button></div></div><div class="progress"><span style="width:${pct}%"></span></div><div class="goalrow small"><span>${money(saved)} ahorrado · ${Math.round(pct)}%</span><span>${money(remaining)} por completar</span></div></div>`}).join(""):empty("Crea tu primera meta","Ejemplos: fondo de emergencia, estudios, vacaciones o un electrodoméstico.")}</div>`}
function renderFamily(){const open=data.tasks.filter(t=>!t.done),done=data.tasks.filter(t=>t.done);return `${heading("Mi familia","Tareas, eventos y responsabilidades del hogar.",cloudRole==="member"?"":`<button class="btn teal" data-modal="task">＋ Agregar</button>`)}<div class="two"><div class="panel"><div class="sectiontitle"><h3>Integrantes</h3>${cloudRole==="member"?"":`<button class="btn light" data-modal="member">＋ Agregar</button>`}</div>${data.members.length?`<div class="list">${data.members.map(m=>`<div class="item"><div class="dot">♡</div><div class="itembody"><strong>${esc(m.name)}</strong><small>${esc(m.role||"Integrante del hogar")} · ${m.canAddExpense===false?"gastos no autorizados":"gastos autorizados"}</small></div>${cloudRole==="member"?"":`<button class="btn light" data-edit-member="${m.id}">✎</button><button class="btn light" data-delete-member="${m.id}">×</button>`}</div>`).join("")}</div>`:empty("Agrega a tu familia","Puedes asignar tareas a los integrantes registrados.")}</div><div class="panel"><div class="sectiontitle"><h3>Resumen</h3></div>${stat("Pendientes",String(open.length),"◷","Tareas sin completar")}${stat("Completadas",String(done.length),"✓","Tareas completadas")}</div></div><div class="section panel"><div class="sectiontitle"><h3>Tareas y eventos</h3><div class="toolbar"><select id="taskfilter"><option value="open">Pendientes</option><option value="all">Todos</option><option value="done">Completados</option></select></div></div><div id="tasklist">${taskRows(open)}</div></div>`}

><p class="small muted" id="backupinfo">Los respaldos pueden contener información personal y financiera. El archivo no está cifrado. La sincronización requiere configurar Supabase y ejecutar el SQL incluido.</p></div><div class="section panel"><div class="sectiontitle"><h3>Preferencias</h3></div><div class="field"><label>Moneda</label><input value="Dólar estadounidense (USD)" disabled></div><div class="field" style="margin-top:12px"><label>Idioma</label><input value="Español" disabled></div><div class="section"><h3>Datos de prueba</h3><p class="muted small">Puedes cargar ejemplos para explorar la app. Esto agrega registros de demostración a tus datos actuales.</p><button class="btn light" data-demo>Cargar datos de ejemplo</button> <button class="btn danger" data-clear>Eliminar todos los datos</button></div></div><div class="section panel"><div class="sectiontitle"><h3>Planes de Mi Hogar 360</h3><span class="badge">Modelo gratuito + Premium</span></div><div class="two"><div class="card"><div class="statlabel">PLAN GRATUITO</div><h3 style="margin:8px 0">Esencial</h3><p class="muted small">Organización familiar básica, tareas, calendario, presupuesto y metas de ahorro en un dispositivo.</p><span class="badge green">Base gratuita</span></div><div class="card"><div class="statlabel">PLAN PREMIUM</div><h3 style="margin:8px 0">Familia conectada</h3><p class="muted small">Sincronización familiar, perfiles con permisos, informes avanzados y exportación de reportes.</p><span class="badge amber">En pruebas · sin cobros</span></div></div><div class="warning" style="margin-top:12px">La aplicación todavía no procesa pagos ni valida suscripciones. El acceso Premium está habilitado para pruebas; antes de ofrecerlo comercialmente se integrará un proveedor de pagos y validación segura del plan.</div></div><div class="section panel"><h3>Sobre Mi Hogar 360</h3><p class="muted">Versión 1.2 · PWA en desarrollo. No se conecta a bancos ni verifica saldos reales. Los recordatorios de esta versión se consultan dentro de la aplicación.</p></div>`}

else if(kind==="member"){obj=id?data.members.find(x=>x.id===id):null;title=obj?"Editar integrante":"Agregar integrante";fields=field("Nombre o apodo","name","text",obj?.name||"")+field("Relación / rol (opcional)","role","text",obj?.role||"",null,false)+field("Permiso para registrar gastos","canAddExpense","select",obj?.canAddExpense===false?"no":"yes",[{value:"yes",label:"Sí, autorizado"},{value:"no",label:"No"}])}

if(kind==="contribution"){const g=extra;if(!g)return;const c={id:uid(),goalId:g.id,type:v.type==="withdraw"?"withdraw":"deposit",amount:cents(v.amount),date:v.date};const current=sum(data.contributions.filter(x=>x.goalId===g.id),x=>x.type==="withdraw"?-x.amount:x.amount);if(c.amount<=0)return toast("El monto debe ser mayor que cero.");if(c.type==="withdraw"&&c.amount>current)return toast("El retiro supera el ahorro registrado.");data.contributions.push(c)}

function closeModal(){document.getElementById("modalroot").innerHTML="";modalEdit=null}
function markPaid(id){const p=data.payments.find(x=>x.id===id);if(!p)return;if(statusPay(p)==="paid")return;const existing=paidTxForPayment(p.id);if(!existing){data.transactions.push({id:uid(),type:"expense",amount:p.amount,description:p.title,category:p.category||"Otros",date:today(),paymentId:p.id,memberId:p.memberId||""})}p.status="paid";p.paidDate=today();if(p.recurrence&&p.recurrence!=="once"){const next={...p,id:uid(),due:dateAdd(p.due,p.recurrence),status:"pending",paidDate:null,seriesId:p.seriesId};data.payments.push(next)}save();render();toast("Pago registrado y movimiento creado.")}
function unpay(id){const p=data.payments.find(x=>x.id===id);if(!p)return; if(!confirm("¿Deshacer este pago? También se quitará el gasto asociado."))return;data.transactions=data.transactions.filter(t=>t.paymentId!==p.id);p.status="pending";p.paidDate=null;const nextIndex=data.payments.findIndex(x=>x.seriesId===p.seriesId&&x.due===dateAdd(p.due,p.recurrence));if(nextIndex>=0)data.payments.splice(nextIndex,1);save();render()}
function exportData(){const payload={app:"Mi Hogar 360",schemaVersion:1,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`MiHogar360_respaldo_${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Respaldo exportado. Guárdalo en un lugar seguro.")}
function importData(file){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result),d=p.data||p;if(!d||!Array.isArray(d.transactions)||!Array.isArray(d.payments)||!Array.isArray(d.goals)||!Array.isArray(d.members)||!Array.isArray(d.tasks)||!Array.isArray(d.contributions)||!Array.isArray(d.budgets))throw Error("Formato no reconocido");if(!confirm("Importar este respaldo reemplazará los datos actuales de Mi Hogar 360. ¿Continuar?"))return;data={...blank(),...d};if(!save())throw Error("No se pudo guardar");render();toast("Respaldo restaurado correctamente.")}catch(e){alert("No se pudo importar el archivo. Verifica que sea un respaldo válido de Mi Hogar 360.")}};r.readAsText(file)}
function demo(){if(!confirm("Se agregarán datos de ejemplo a los registros actuales. ¿Continuar?"))return;const monthKey=today().slice(0,7);data.members.push({id:uid(),name:"Ana",role:"Familia"},{id:uid(),name:"Carlos",role:"Familia"});data.transactions.push({id:uid(),type:"income",amount:125000,description:"Ingreso mensual",category:"Otros",date:today()},{id:uid(),type:"expense",amount:28500,description:"Compra de supermercado",category:"Alimentación",date:today(),memberId:""},{id:uid(),type:"expense",amount:12000,description:"Transporte",category:"Transporte",date:today(),memberId:""});data.payments.push({id:uid(),title:"Internet",amount:3000,due:today(),category:"Servicios",recurrence:"monthly",status:"pending",seriesId:uid()},{id:uid(),title:"Electricidad",amount:4500,due:dateAdd(today(),"weekly"),category:"Servicios",recurrence:"once",status:"pending",seriesId:uid()});const gid=uid();data.goals.push({id:gid,name:"Fondo de emergencia",target:50000,due:"",notes:""});data.contributions.push({id:uid(),goalId:gid,type:"deposit",amount:10000,date:today()});data.budgets.push({id:uid(),category:"Alimentación",limit:40000,month:monthKey});data.tasks.push({id:uid(),kind:"task",title:"Preparar lista de compras",due:today(),assignee:data.members[0].id,priority:"normal",done:false},{id:uid(),kind:"event",title:"Actividad familiar",due:dateAdd(today(),"weekly"),assignee:"",priority:"normal",done:false});save();render();toast("Datos de ejemplo agregados.")}
function deleteItem(arr,id){const i=arr.findIndex(x=>x.id===id);if(i<0)return;arr.splice(i,1);save();render()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.modal){openModal(b.dataset.modal);return}if(b.dataset.month){month+=Number(b.dataset.month);if(month<0){month=11;year--}if(month>11){month=0;year++}render();return}if(b.dataset.pay){markPaid(b.dataset.pay);return}if(b.dataset.unpay){unpay(b.dataset.unpay);return}if(b.dataset.editPayment){openModal("payment",b.dataset.editPayment);return}if(b.dataset.editTx){openModal("transaction",b.dataset.editTx);return}if(b.dataset.editGoal){openModal("goal",b.dataset.editGoal);return}if(b.dataset.editMember){openModal("member",b.dataset.editMember);return}if(b.dataset.editTask){openModal("task",b.dataset.editTask);return}if(b.dataset.contribute){const g=data.goals.find(x=>x.id===b.dataset.contribute);openModal("contribution",null,g);return}if(b.dataset.deleteTx){if(confirm("¿Eliminar este movimiento?"))deleteItem(data.transactions,b.dataset.deleteTx);return}if(b.dataset.deleteGoal){if(confirm("¿Eliminar esta meta y sus aportaciones?")){data.contributions=data.contributions.filter(c=>c.goalId!==b.dataset.deleteGoal);deleteItem(data.goals,b.dataset.deleteGoal)}return}if(b.dataset.deleteMember){const id=b.dataset.deleteMember;if(confirm("¿Eliminar este integrante? Las tareas existentes conservarán el registro, pero podrían quedar sin responsable.")){data.members=data.members.filter(m=>m.id!==id);data.tasks.forEach(t=>{if(t.assignee===id)t.assignee=""});save();render()}return}if(b.dataset.deleteTask){if(confirm("¿Eliminar esta tarea o evento?"))deleteItem(data.tasks,b.dataset.deleteTask);return}if(b.hasAttribute("data-export")){exportData();return}if(b.hasAttribute("data-export-csv")){exportCSV();return}if(b.hasAttribute("data-cloud-disconnect")){disconnectCloud();return}if(b.dataset.auth){authAction(b.dataset.auth);return}if(b.hasAttribute("data-house-create")){createHousehold();return}if(b.hasAttribute("data-house-join")){joinHousehold();return}if(b.hasAttribute("data-house-invite")){createInvite();return}if(b.hasAttribute("data-import")){document.getElementById("importfile").click();return}if(b.hasAttribute("data-demo")){demo();return}if(b.hasAttribute("data-clear")){if(confirm("Esto eliminará todos los datos guardados en este navegador. Exporta un respaldo antes. ¿Continuar?")){data=blank();save();render();toast("Datos eliminados.")}return}});
document.addEventListener("submit",e=>{if(e.target.id==="cloudconfigform"){e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());localStorage.setItem(CLOUDCFG,JSON.stringify({url:v.supabaseUrl.trim().replace(/\/$/,""),key:v.supabaseKey.trim()}));initCloud(true);return}if(e.target.id==="authform"){e.preventDefault();authAction(e.submitter?.dataset.auth||"login",Object.fromEntries(new FormData(e.target).entries()));return}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.taskToggle){const t=data.tasks.find(x=>x.id===el.dataset.taskToggle);if(t){t.done=el.checked;save();render()}return}if(el.id==="importfile"&&el.files?.[0])importData(el.files[0])});
function getCloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUDCFG)||"{}")}catch(e){return {}}}
function cloudReady(){return !!(cloudClient&&cloudUser&&cloudHouseholdId)}
function scheduleCloudSync(){if(!cloudReady()||cloudBusy)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>syncCloud(),900)}
async function initCloud(showToast=false){const c=getCloudConfig();if(!c.url||!c.key||!window.supabase){cloudClient=null;cloudStatus="Sin configurar";if(showToast)toast("Revisa la URL y la clave pública de Supabase.");renderIfSettings();return}try{cloudClient=window.supabase.createClient(c.url,c.key);const {data:{session}}=await cloudClient.auth.getSession();cloudSession=session;cloudUser=session?.user||null;cloudStatus=cloudUser?"Conectado":"Configurado · sin sesión";cloudClient.auth.onAuthStateChange((_event,session)=>{cloudSession=session;cloudUser=session?.user||null;cloudStatus=cloudUser?(cloudHouseholdId?"Sincronización activa":"Sesión iniciada · falta conectar hogar"):"Configurado · sin sesión";renderIfSettings()});if(cloudUser&&cloudHouseholdId){await refreshCloudRole();await pullCloud(false)}if(showToast)toast("Conexión Supabase configurada.");renderIfSettings()}catch(e){cloudStatus="Error de conexión";if(showToast)toast("No se pudo conectar. Revisa URL, clave y tablas SQL.");renderIfSettings()}}
function renderIfSettings(){if(page==="settings")render()}
async function authAction(action,values=null){if(action==="logout"){if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;cloudSession=null;cloudStatus="Sesión cerrada";toast("Sesión cerrada.");renderIfSettings();return}if(!cloudClient){toast("Primero guarda la conexión de Supabase.");return}const form=document.getElementById("authform");if(!values&&form)values=Object.fromEntries(new FormData(form).entries());if(!values?.email||!values?.password){toast("Escribe correo y contraseña.");return}try{const result=action==="signup"?await cloudClient.auth.signUp({email:values.email,password:values.password}):await cloudClient.auth.signInWithPassword({email:values.email,password:values.password});if(result.error)throw result.error;cloudSession=result.data.session;cloudUser=result.data.user;cloudStatus=cloudSession?"Sesión iniciada":"Revisa tu correo para confirmar la cuenta";if(cloudUser&&cloudHouseholdId){await refreshCloudRole();await pullCloud(false)}toast(action==="signup"&&!cloudSession?"Cuenta creada. Confirma el correo y luego inicia sesión.":"Sesión iniciada.");renderIfSettings()}catch(e){toast("Autenticación: "+(e.message||"no se pudo completar"))}}
async function createHousehold(){if(!cloudClient||!cloudUser){toast("Conecta Supabase e inicia sesión primero.");return}const name=document.querySelector('#houseform [name="householdName"]')?.value.trim()||"Mi hogar";try{const {data:house,error}=await cloudClient.from("households").insert({name,owner_id:cloudUser.id,data:data}).select("id").single();if(error)throw error;const {error:memberError}=await cloudClient.from("household_members").insert({household_id:house.id,user_id:cloudUser.id,role:"admin",can_add_expenses:true,member_profile_id:null});if(memberError)throw memberError;cloudHouseholdId=house.id;cloudRole="admin";localStorage.setItem(CLOUDHOUSE,house.id);cloudStatus="Sincronización activa";document.getElementById("houseinfo").textContent="Hogar conectado: "+house.id;toast("Hogar creado y datos iniciales subidos.");renderIfSettings()}catch(e){toast("No se pudo crear el hogar. Ejecuta supabase_schema.sql y revisa las políticas: "+(e.message||"error"))}}
async function joinHousehold(){if(!cloudClient||!cloudUser){toast("Conecta Supabase e inicia sesión primero.");return}const code=document.querySelector('#houseform [name="inviteCode"]')?.value.trim();if(!code){toast("Escribe el código de invitación.");return}try{const {data:hid,error}=await cloudClient.rpc("join_household",{p_code:code});if(error)throw error;cloudHouseholdId=hid;localStorage.setItem(CLOUDHOUSE,hid);await refreshCloudRole();await pullCloud(true);cloudStatus="Sincronización activa";toast("Te has unido al hogar y los datos se sincronizaron.");renderIfSettings()}catch(e){toast("No se pudo unir. Verifica el código, su vigencia y el SQL: "+(e.message||"error"))}}
async function createInvite(){if(!cloudClient||!cloudUser||!cloudHouseholdId){toast("Inicia sesión y conecta primero un hogar.");return}const member=data.members.find(m=>m.id===document.querySelector('#houseform [name="memberProfileId"]')?.value)||data.members[0];if(!member){toast("Primero agrega a la familia un perfil de integrante.");return}try{const {data:code,error}=await cloudClient.rpc("create_household_invite",{p_household_id:cloudHouseholdId,p_member_profile_id:member.id,p_can_add_expenses:member.canAddExpense!==false});if(error)throw error;cloudInviteCode=code;GenCopy(code);toast("Código de invitación copiado: "+code)}catch(e){toast("No se pudo crear la invitación: "+(e.message||"error"))}}
function GenCopy(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).catch(()=>{});else{const el=document.createElement("textarea");el.value=t;document.body.append(el);el.select();document.execCommand("copy");el.remove()}}
async function syncCloud(){if(!cloudReady()||cloudBusy)return;cloudBusy=true;try{const {error}=await cloudClient.rpc("save_household_data",{p_household_id:cloudHouseholdId,p_data:data});if(error)throw error;cloudStatus="Sincronizado"}catch(e){cloudStatus="Pendiente de sincronizar";console.warn("Mi Hogar 360 sync:",e.message)}finally{cloudBusy=false}}
async function refreshCloudRole(){if(!cloudClient||!cloudUser||!cloudHouseholdId)return;try{const {data:row,error}=await cloudClient.from("household_members").select("role,can_add_expenses,member_profile_id").eq("household_id",cloudHouseholdId).eq("user_id",cloudUser.id).single();if(error)throw error;cloudRole=row.role;cloudCanAddExpenses=!!row.can_add_expenses;cloudMemberProfileId=row.member_profile_id||null;localStorage.setItem("mihogar360_cloud_role",cloudRole)}catch(e){cloudRole=null;cloudCanAddExpenses=false;cloudMemberProfileId=null}}
async function pullCloud(showMessage=true){if(!cloudClient||!cloudUser||!cloudHouseholdId)return;try{const {data:row,error}=await cloudClient.from("households").select("data").eq("id",cloudHouseholdId).single();if(error)throw error;if(row?.data&&typeof row.data==="object"){data={...blank(),...row.data};localStorage.setItem(DB,JSON.stringify(data));render();cloudStatus="Sincronizado";if(showMessage)toast("Datos familiares descargados.")}}catch(e){cloudStatus="No se pudo descargar";if(showMessage)toast("No se pudo descargar el hogar: "+(e.message||"error"))}}
function disconnectCloud(){localStorage.removeItem(CLOUDCFG);localStorage.removeItem(CLOUDHOUSE);cloudHouseholdId="";cloudClient=null;cloudUser=null;cloudSession=null;cloudRole=null;cloudMemberProfileId=null;cloudCanAddExpenses=false;cloudStatus="Sin configurar";toast("Conexión local desconectada. Tus datos locales se conservan.");renderIfSettings()}
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
initCloud(false);
render();
})();
</script>
